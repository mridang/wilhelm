name: Format Code

on: push

permissions:
  contents: read

defaults:
  run:
    working-directory: ./

jobs:
  code-formatting:
    runs-on: ubuntu-latest

    steps:
      - name: Runner Common Setup
        uses: mridang/action-runner-common@v1

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Install dprint
        run: curl -fsSL https://dprint.dev/install.sh | sh

      - name: Check dprint
        run: ~/.dprint/bin/dprint check

      - name: Check gofmt
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Check gofmt across every submodule
        run: |
          set -euo pipefail
          for mod in $(find assert env -name go.mod); do
            unformatted=$(cd "$(dirname "$mod")" && gofmt -s -l .)
            if [ -n "$unformatted" ]; then
              echo "$unformatted"
              exit 1
            fi
          done
