name: Release to Github

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: write

defaults:
  run:
    working-directory: ./

env:
  GONOSUMDB: github.com/mridang/wilhelm/*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-package:
    runs-on: ubuntu-latest

    steps:
      - name: Runner Common Setup
        uses: mridang/action-runner-common@v1

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"

      - name: Run tests
        run: go test ./...

      - name: Run semantic-release
        uses: mridang/action-semantic-release@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Refresh go.sum of the submodules
        env:
          GOWORK: "off"
          GOPRIVATE: github.com/mridang/wilhelm/*
        run: |
          git pull --ff-only
          for mod in $(find assert env -name go.mod | sort); do
            (cd "$(dirname "$mod")" && go mod tidy)
          done
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u -- assert env
            git commit -m "chore(release): refresh submodule go.sum [skip ci]"
            git push
          fi
